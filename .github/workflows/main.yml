name: Daily Tech Mage Upload
on:
  schedule:
    - cron: '0 18 * * *' # Runs daily at 18:00 UTC (7PM Nigeria)
  workflow_dispatch:      # Allows you to click a button to run it manually

jobs:
  run-tech-mage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          # This line fixes the "security policy" error that stops MoviePy
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
      
      - name: Run Main Script
        env:
          # Mapping your HUGGING_FACE_API_KEY secret to every possible name
          HF_TOKEN: ${{ secrets.HUGGING_FACE_API_KEY }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          
          # Mapping your API_TOKEN secret to every possible name
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          
          # These already work (they show ***)
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          PICKLE_TOKEN: ${{ secrets.PICKLE_TOKEN }}
        run: python main.py
