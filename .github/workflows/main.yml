name: Daily Tech Mage Upload
on:
  schedule:
    - cron: '0 11,18 * * *' # Runs daily at 11:00 and 18:00 UTC
  workflow_dispatch:      # Allows manual run

jobs:
  run-tech-mage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
      
      - name: Run Main Script
        env:
          HF_TOKEN: ${{ secrets.HUGGING_FACE_API_KEY }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          PICKLE_TOKEN: ${{ secrets.PICKLE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python main.py  # 🪄 FIXED: This is now inside the correct step

      - name: Upload Logs and Images
        if: always()  # 🪄 FIXED: Runs even if the script fails
        uses: actions/upload-artifact@v4
        with:
          name: tech-mage-outputs
          path: |
            automation_errors.log
            script_output.txt
            output/
          retention-days: 5
